# 本地零信任网关配置：全部为内置测试材料，不依赖任何外部服务或真实凭证
# 凭证格式: subjectId:base64(HMAC密钥)，多条以逗号分隔
zero-trust.gateway.credentials=alice:YWxpY2UtbG9jYWwtc2VjcmV0LWtleS0wMDAx,bob:Ym9iLWxvY2FsLXNlY3JldC1rZXktMDAwMiEhIQ==
# 每个调用主体每个固定窗口允许放行的请求数
zero-trust.gateway.quota-per-window=5
# 固定窗口长度（毫秒）
zero-trust.gateway.window-millis=60000
# 请求时间戳与本地时钟允许的偏差（毫秒），同时决定重放 ID 的保留时长
zero-trust.gateway.timestamp-skew-millis=30000
# 服务端集中登记的凭证生命周期（可选，不配置则与旧版本完全兼容）：
#   subject:notBefore:notAfter  毫秒时间戳边界，留空表示该边界不限制
#   subject:revoked             立即撤销
# 例：charlie:1759400000000:1790000000000,erin::1759000000000,dave:revoked
zero-trust.gateway.credential-lifecycles=
# 每个主体保留的有效 requestId 记录上限（达到上限且无过期可清理时 fail-closed 拒绝）
zero-trust.gateway.replay-max-records-per-subject=100000
logging.level.com.github.h3yow.zerotrustgatewayjava=INFO
