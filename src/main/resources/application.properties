# 本地零信任网关配置：全部为内置测试材料，不依赖任何外部服务或真实凭证
# 凭证格式（兼容旧格式）: subjectId:base64(HMAC密钥)，多条以逗号分隔
# 可选服务端生命周期段（冒号分段，均可留空）:
#   subjectId:base64(HMAC密钥):notBeforeMillis:notAfterMillis:revoked
#   例: carol:Y2Fyb2wtbG9jYWwtc2VjcmV0:1700000000000:1800000000000:false
# 判定一律以本地登记的生命周期为准；运行期可通过 LocalCredentialRegistry#revoke 立即撤销。
zero-trust.gateway.credentials=alice:YWxpY2UtbG9jYWwtc2VjcmV0LWtleS0wMDAx,bob:Ym9iLWxvY2FsLXNlY3JldC1rZXktMDAwMiEhIQ==
# 每个调用主体每个固定窗口允许放行的请求数
zero-trust.gateway.quota-per-window=5
# 固定窗口长度（毫秒）
zero-trust.gateway.window-millis=60000
# 请求时间戳与本地时钟允许的偏差（毫秒），同时决定重放 ID 的保留时长（记录在 timestamp+skew 到期）
zero-trust.gateway.timestamp-skew-millis=30000
# 单个主体窗口内保留的请求标识数量上限；先清过期记录、仍达上限时返回 REPLAY_STORE_FULL(503)，
# 不静默放过，也不淘汰仍在有效期内的记录（默认 10000）
zero-trust.gateway.replay-max-ids-per-subject=10000
logging.level.com.github.h3yow.zerotrustgatewayjava=INFO
