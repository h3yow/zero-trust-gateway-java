# 零信任网关本地配置（全部为本地演示值，无真实凭证/外部服务）
spring.application.name=zero-trust-gateway

# 请求时间戳允许的偏移窗口（秒）
ztg.timestamp-window-seconds=30
# 已用 nonce 的保留时长（秒）
ztg.nonce-ttl-seconds=120
# 每个调用主体每个固定窗口的配额
ztg.rate-limit-requests=10
ztg.rate-limit-window-seconds=10

# 本地登记凭证（不同类型/版本归一到同一主体 principal）
ztg.credentials[0].key-id=demo-key-v1
ztg.credentials[0].secret=local-demo-secret-v1
ztg.credentials[0].type=V1_HMAC_SHA1
ztg.credentials[0].principal=svc-demo
ztg.credentials[0].expires-at=2099-01-01T00:00:00Z

ztg.credentials[1].key-id=demo-key-v2
ztg.credentials[1].secret=local-demo-secret-v2
ztg.credentials[1].type=V2_HMAC_SHA256
ztg.credentials[1].principal=svc-demo
ztg.credentials[1].expires-at=2099-01-01T00:00:00Z

ztg.credentials[2].key-id=partner-key-v2
ztg.credentials[2].secret=local-partner-secret
ztg.credentials[2].type=V2_HMAC_SHA256
ztg.credentials[2].principal=svc-partner
ztg.credentials[2].expires-at=2099-01-01T00:00:00Z

# 已过期凭证，用于演示 CREDENTIAL_EXPIRED
ztg.credentials[3].key-id=expired-key-v1
ztg.credentials[3].secret=local-expired-secret
ztg.credentials[3].type=V1_HMAC_SHA1
ztg.credentials[3].principal=svc-expired
ztg.credentials[3].expires-at=2020-01-01T00:00:00Z
